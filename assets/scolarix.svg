<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0B1B4D"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- feuille arrière (archives) -->
  <g transform="rotate(-9 256 256)" filter="url(#sh)">
    <rect x="150" y="104" width="200" height="262" rx="22" fill="#93C5FD"/>
  </g>
  <!-- relevé au premier plan -->
  <g filter="url(#sh)">
    <rect x="166" y="112" width="208" height="276" rx="24" fill="#FFFFFF"/>
    <rect x="196" y="148" width="104" height="18" rx="9" fill="#1D4ED8"/>
    <rect x="196" y="186" width="148" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="196" y="212" width="148" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="196" y="238" width="120" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="196" y="264" width="136" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="196" y="290" width="92" height="12" rx="6" fill="#CBD5E1"/>
  </g>
  <!-- sceau de conformité -->
  <g filter="url(#sh)">
    <circle cx="352" cy="352" r="70" fill="url(#seal)"/>
    <circle cx="352" cy="352" r="54" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.85"/>
    <path d="M324 354 L344 374 L384 332" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
