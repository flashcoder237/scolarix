name: Construire Scolarix pour Windows (exécutable + installateur)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Certificat interne de la Cellule Informatique (Settings > Secrets and variables > Actions).
      # Absents : la compilation continue, sans signature.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Exécutable (PyInstaller)
        run: pyinstaller --noconfirm fmsp_archives.spec

      - name: Signature de l'exécutable (certificat interne FMSP)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object FullName -match "x64" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          "SIGNTOOL=$signtool" | Out-File -Append $env:GITHUB_ENV
          "SIGN_PFX=$pfx" | Out-File -Append $env:GITHUB_ENV
          & $signtool sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /d "Scolarix" dist\Scolarix\Scolarix.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $sig = Get-AuthenticodeSignature dist\Scolarix\Scolarix.exe
          Write-Host "Signataire : $($sig.SignerCertificate.Subject)"
          if ($sig.SignerCertificate.Subject -notmatch "FMSP") { exit 1 }

      - name: Vérification rapide de l'exécutable (robot parallèle + exclusions)
        shell: pwsh
        run: |
          python tools/generate_samples.py archives_demo
          New-Item -ItemType Directory -Force archives_demo\DIPLOMES | Out-Null
          Copy-Item (Get-ChildItem archives_demo -Filter *.pdf -Recurse | Select-Object -First 1).FullName archives_demo\DIPLOMES\a_ignorer.pdf
          $env:FMSP_DATA_DIR = "$PWD\ci_data"
          $p = Start-Process -FilePath "dist\Scolarix\Scolarix.exe" `
               -ArgumentList "--index","--json","--source","archives_demo","--no-ocr","--workers","2","--exclude","DIPLOMES" `
               -RedirectStandardOutput ci_index.log -Wait -PassThru -NoNewWindow
          Get-Content ci_index.log -Tail 3
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path ci_index.log -Pattern '"type": "done"' -Quiet)) { exit 1 }
          if (-not (Select-String -Path ci_index.log -Pattern '"workers": 2' -Quiet)) { exit 1 }
          if (Select-String -Path ci_index.log -Pattern 'a_ignorer' -Quiet) { Write-Error "exclusion ignorée"; exit 1 }
          Start-Sleep -Seconds 3
          $left = Get-Process -Name Scolarix -ErrorAction SilentlyContinue
          if ($left) { Write-Error "processus de lecture restés ouverts"; exit 1 }

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if ($env:SIGN_PFX) {
            $cmd = "`"$env:SIGNTOOL`" sign /f `"$env:SIGN_PFX`" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d `$qScolarix`$q `$f"
            & $iscc /DAppVersion=1.2.0 /DSIGN "/Ssigntool=$cmd" installer\scolarix.iss
          } else {
            Write-Host "Secrets de signature absents : installateur NON signé."
            & $iscc /DAppVersion=1.2.0 installer\scolarix.iss
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem Output\*.exe | ForEach-Object { $s = Get-AuthenticodeSignature $_; Write-Host "$($_.Name) : $($s.Status) $($s.SignerCertificate.Subject)" }
          Get-ChildItem Output

      - name: Archive zip (version portable)
        shell: pwsh
        run: |
          Copy-Item README.md dist\Scolarix\LISEZMOI.md
          Compress-Archive -Path dist\Scolarix -DestinationPath Scolarix_Portable_Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Scolarix_Installateur_Windows
          path: Output/Scolarix_Setup_*.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Scolarix_Portable_Windows
          path: Scolarix_Portable_Windows.zip
          retention-days: 30

      - name: Publication (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/Scolarix_Setup_*.exe
            Scolarix_Portable_Windows.zip
